:root{
  --plaster:#F5EEE3; --plaster-2:#EEE4D4; --plaster-3:#E7DCC9;
  --sand:#EADFCB; --sand-2:#DFD2B9; --sand-3:#CDBB9C;
  --choc:#3A2A1F; --choc-2:#6B5343; --choc-3:#9B8674;
  --navy:#1E2A44; --navy-2:#2B3A5E; --navy-soft:#DDE0E8;
  --olive:#6B7445; --olive-2:#E3E6D2; --olive-3:#58613A;
  --terra:#B5543A; --terra-2:#F2DED4;
  --gold:#C2A14D; --gold-2:#EFE3C2;
  --cream:#F7F1E5;
  --r:18px; --r-s:12px; --r-xs:8px;
  --shadow:0 1px 2px rgba(58,42,31,.05),0 10px 30px -16px rgba(58,42,31,.25);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --tabbar:64px; --ease:cubic-bezier(.2,.7,.2,1); --dur:.22s;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--plaster);-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;color:var(--choc);background:var(--plaster);min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tabbar) + var(--safe-b) + 24px);touch-action:manipulation;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.serif{font-family:Marcellus,Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.012em;margin:0;line-height:1.2}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px}h4{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
svg{display:block}
.hide{display:none!important}
.muted{color:var(--choc-3)}.sec{color:var(--choc-2)}
.micro{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--choc-3)}
.small{font-size:13px}.italic{font-style:italic}
.gold{color:var(--gold)}.olive{color:var(--olive)}.terra{color:var(--terra)}.navy{color:var(--navy)}
.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,238,227,.92);-webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(58,42,31,.06);min-height:calc(54px + var(--safe-t))}
.wordmark{font-family:Marcellus,Georgia,serif;font-size:21px;color:var(--navy);letter-spacing:.02em}
.wordmark small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--choc-3);margin-top:1px;font-weight:600}
.statusbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--choc-2);position:relative;margin-right:-8px}
.statusbtn .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--plaster);display:none}
.statusbtn.dirty .dot{display:block}

/* layout */
.view{padding:16px 16px 0;max-width:620px;margin:0 auto}
.section{margin-top:24px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:12px}
.section-h h2{font-size:21px}
.card{background:var(--sand);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.cream{background:var(--cream)}
.card + .card{margin-top:12px}
.divider{height:1px;background:rgba(58,42,31,.08);margin:14px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;background:var(--navy);color:var(--cream);font-weight:600;font-size:16px;width:100%;transition:transform var(--dur) var(--ease),background var(--dur),opacity var(--dur);border:1px solid transparent}
.btn:active{transform:scale(.985)}
.btn[disabled]{pointer-events:none;background:var(--sand-2);color:var(--choc-3);border-color:transparent}
.btn.ghost[disabled]{background:transparent;border-color:rgba(58,42,31,.12)}
.btn.nowrap{white-space:nowrap;padding:0 12px}
.btn.hero{min-height:64px;font-size:18px;border-radius:18px;font-family:Marcellus,Georgia,serif;font-weight:400;letter-spacing:.04em;box-shadow:0 14px 30px -14px rgba(30,42,68,.6)}
.btn.ghost{background:transparent;border-color:rgba(30,42,68,.35);color:var(--navy)}
.btn.olive{background:var(--olive);color:#fff}
.btn.sand{background:var(--sand-2);color:var(--choc)}
.btn.soft{background:var(--plaster);color:var(--navy);border-color:rgba(30,42,68,.12)}
.btn.terra{background:transparent;color:var(--terra);border-color:rgba(181,84,58,.35)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px;width:auto}
.btn.xs{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px;width:auto;font-weight:500}
.btn.auto{width:auto}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--choc-2);background:transparent;transition:background var(--dur)}
.iconbtn:active{background:rgba(58,42,31,.07)}
.iconbtn.on{color:var(--terra)}
.link{color:var(--navy);text-decoration:underline;text-underline-offset:3px;font-weight:500}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips.scroll::after{content:"";flex:none;width:12px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:999px;background:var(--plaster);border:1px solid rgba(58,42,31,.12);color:var(--choc);font-size:14px;font-weight:500;white-space:nowrap;transition:background var(--dur),color var(--dur),border-color var(--dur)}
.chip.on{background:var(--olive-3);border-color:var(--olive-3);color:#fff}
.chip.navy.on{background:var(--navy);border-color:var(--navy)}
.chip.sm{min-height:36px;padding:0 12px;font-size:13px}
.chip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}

/* segmented */
.seg{display:flex;background:var(--plaster-3);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--choc-2);transition:background var(--dur),color var(--dur)}
.seg button.on{background:var(--cream);color:var(--navy);box-shadow:0 1px 2px rgba(58,42,31,.12);font-weight:600}
.seg.olive button.on{background:var(--olive);color:#fff}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--choc-3)}
.input{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid rgba(58,42,31,.14);background:var(--cream);color:var(--choc);font-size:16px;outline:none;transition:border-color var(--dur),box-shadow var(--dur)}
.input:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(107,116,69,.18)}
textarea.input{min-height:80px;padding:12px 14px;resize:vertical}
.input::placeholder{color:var(--choc-3)}
input[type=date].input{-webkit-appearance:none;appearance:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 0}
.switch{width:52px;height:32px;border-radius:999px;background:var(--sand-3);position:relative;flex:none;transition:background var(--dur)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform var(--dur) var(--ease)}

/* swatches */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:10px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--choc-2);font-size:10px;text-align:center;line-height:1.1}

.swatch.second .c{box-shadow:0 0 0 3px var(--plaster),0 0 0 5px var(--sand-3)}
.swatch .c .n{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--olive);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--plaster)}
.swatch.lg .c{width:56px;height:56px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(58,42,31,.18);display:inline-block;flex:none}
.dot.accent{box-shadow:0 0 0 2px var(--plaster),0 0 0 3.5px var(--gold)}
.dots{display:inline-flex;align-items:center}
.dots .dot + .dot{margin-left:-4px}

/* closet rows */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(58,42,31,.07);min-height:64px}
.item:last-child{border-bottom:0}
.item .dots{width:30px;justify-content:flex-start;flex:none}
.item .name{font-weight:500;font-size:16px}
.item .meta{font-size:13px;color:var(--choc-3);margin-top:1px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--plaster);color:var(--choc-2);vertical-align:middle}
.tag.terra{background:var(--terra-2);color:var(--terra)}
.tag.olive{background:var(--olive-2);color:var(--olive-3)}
.tag.gold{background:var(--gold-2);color:#8B6F2B}
.tag.navy{background:var(--navy-soft);color:var(--navy)}
.washbtn{min-width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--choc-3)}
.washbtn.on{background:var(--navy-soft);color:var(--navy)}

/* outfit card */
.look{background:var(--sand);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.look + .look{margin-top:14px}
.look .strip{display:flex;height:7px}
.look .strip span{flex:1;position:relative}
.look .strip span.accent::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--gold)}
.look .body{padding:14px 16px 12px}
.look .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.look .slots{display:flex;flex-direction:column}

.slot:last-child{border-bottom:0}
.slot .lab{width:56px;flex:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--choc-3)}
.slot .nm{flex:1;min-width:0;font-size:15.5px;font-weight:500}
.slot .nm small{display:block;font-weight:400;font-size:12px;color:var(--choc-3)}
.slot.tap{cursor:pointer}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;background:var(--cream);border-radius:12px;font-size:14px;font-style:italic;color:var(--choc-2);line-height:1.4}
.note::before{content:"";width:3px;align-self:stretch;background:var(--gold);border-radius:2px;flex:none}
.look .actions{display:flex;gap:8px;margin-top:12px}
.look .actions .btn{flex:1;min-height:44px;font-size:14px;padding:0 8px;border-radius:12px}
.look .ctx{font-size:12px;color:var(--choc-3)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--choc-3);font-weight:600;padding:4px 0;letter-spacing:.06em}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--choc-2);position:relative;background:transparent}
.cal .d.has{background:var(--cream);color:var(--choc);font-weight:600}
.cal .d.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--olive);position:absolute;bottom:6px}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal .d.on{background:var(--navy);color:var(--cream)}.cal .d.on::after{background:var(--gold)}
.cal .d.out{opacity:.3}

/* stats */
.stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(58,42,31,.07);gap:12px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:600}
.stat .nm{flex:1;min-width:0}.stat .nm small{display:block;font-size:12px;color:var(--choc-3)}
.bar{height:6px;border-radius:3px;background:var(--plaster);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--olive);border-radius:3px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(58,42,31,.38);z-index:40;opacity:0;transition:opacity var(--dur)}
.overlay.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--plaster);border-radius:24px 24px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s var(--ease);box-shadow:0 -10px 40px rgba(58,42,31,.2);max-width:620px;margin:0 auto}
.sheet.in{transform:translateY(0)}
.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--sand-3);margin:10px auto 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px 20px;gap:10px}
.sheet .sh h2{font-size:22px}
.sheet .sb{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 20px calc(14px + var(--safe-b));border-top:1px solid rgba(58,42,31,.08);display:flex;gap:10px;background:var(--plaster)}
.sheet .sf .btn{flex:1}
.list-pick{display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 4px;border-bottom:1px solid rgba(58,42,31,.07);text-align:left;width:100%}
.pick:last-child{border-bottom:0}
.pick .t{flex:1;min-width:0;font-weight:500}
.pick .t small{display:block;font-weight:400;color:var(--choc-3);font-size:13px}
.pick.on{color:var(--olive-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.occ{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:66px;padding:10px 14px;border-radius:14px;background:var(--cream);border:1px solid rgba(58,42,31,.08);text-align:left;font-weight:500;font-size:15px;color:var(--choc);transition:background var(--dur),border-color var(--dur),color var(--dur)}
.occ small{font-size:11.5px;color:var(--choc-3);font-weight:400}
.occ.on{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.occ.on small{color:rgba(247,241,229,.7)}

.wx{display:flex;align-items:center;gap:14px}
.wx .temp{font-family:Marcellus,Georgia,serif;font-size:44px;line-height:1;color:var(--navy);min-width:86px}
.wx .temp sup{font-size:18px;vertical-align:top;margin-left:2px}
.wx .desc{font-size:14px;color:var(--choc-2)}
.wx .ico{color:var(--gold)}

.tab.on{color:var(--navy)}
.tab.on::before{content:"";position:absolute;top:0;width:22px;height:2px;background:var(--gold);border-radius:0 0 2px 2px}
.tab .b{position:absolute;top:8px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--gold);display:none}
.tab.badge .b{display:block}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--safe-b) + 14px);transform:translate(-50%,16px);background:var(--choc);color:var(--cream);padding:12px 18px;border-radius:14px;font-size:14px;z-index:60;display:flex;align-items:center;gap:14px;opacity:0;transition:opacity var(--dur),transform var(--dur) var(--ease);max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;line-height:1.35}
.toast.in{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--gold);font-weight:600;white-space:nowrap;flex:none}

.empty{text-align:center;padding:36px 20px;color:var(--choc-2)}
.empty .art{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--gold)}
.empty h3{color:var(--choc);margin-bottom:6px}
.empty p{font-size:14px;max-width:300px;margin:0 auto}
.empty .btn{margin-top:18px;width:auto;min-width:200px}

/* hero */
.hero-wrap{margin-top:16px}
.date-line{font-size:13px;color:var(--choc-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.pack-day{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(58,42,31,.07)}
.pack-day:last-child{border-bottom:0}
.pack-day .n{width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--cream);display:grid;place-items:center;font-family:Marcellus,serif;flex:none}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
.verdict.great{background:var(--olive-2);color:var(--olive-3)}
.verdict.ok{background:var(--gold-2);color:#7E6425}
.verdict.avoid{background:var(--terra-2);color:var(--terra)}
.bigswatch{width:72px;height:72px;border-radius:20px;border:1px solid rgba(58,42,31,.15);flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
.kv span:last-child{font-weight:600;text-align:right}
.counter{display:inline-flex;align-items:center;gap:0;background:var(--cream);border-radius:12px;border:1px solid rgba(58,42,31,.12)}
.counter button{width:46px;height:46px;font-size:20px;color:var(--navy)}
.counter b{min-width:40px;text-align:center;font-weight:600}
.inline-note{font-size:13px;color:var(--choc-2);background:var(--cream);border-radius:12px;padding:10px 12px;line-height:1.4}
.inline-note.terra{background:var(--terra-2);color:var(--terra)}
.inline-note.olive{background:var(--olive-2);color:var(--olive-3)}
.fade{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.sheet{transition:none}}
@media (min-width:640px){.view{padding-top:24px}.grid2.wide{grid-template-columns:1fr 1fr 1fr}}
